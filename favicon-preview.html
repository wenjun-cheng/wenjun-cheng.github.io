<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Preview</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .icon-preview {
            margin: 20px;
            text-align: center;
        }
        .icon {
            display: inline-block;
            margin: 10px;
            border: 1px solid #ddd;
            background: white;
        }
    </style>
</head>
<body>
    <h1>Favicon Preview - "W" Icon</h1>
    
    <div class="icon-preview">
        <h3>16x16 (Browser Tab Size)</h3>
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="16" height="16">
            <rect width="100" height="100" fill="#2563eb" rx="15"/>
            <text x="50" y="70" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="white">W</text>
        </svg>
    </div>
    
    <div class="icon-preview">
        <h3>32x32 (Standard Size)</h3>
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
            <rect width="100" height="100" fill="#2563eb" rx="15"/>
            <text x="50" y="70" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="white">W</text>
        </svg>
    </div>
    
    <div class="icon-preview">
        <h3>64x64 (Large Size)</h3>
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
            <rect width="100" height="100" fill="#2563eb" rx="15"/>
            <text x="50" y="70" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="white">W</text>
        </svg>
    </div>

    <p>这个图标的特点：</p>
    <ul>
        <li>蓝色背景 (#2563eb) - 专业且现代</li>
        <li>白色的 "W" 字母 - 高对比度，清晰可见</li>
        <li>圆角矩形设计 - 现代化外观</li>
        <li>在小尺寸下仍然清晰</li>
    </ul>
</body>
</html>
